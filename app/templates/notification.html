<div id="notifications-container" class="space-y-4 w-80 z-50"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io({
        transports: ['websocket', 'polling']
    });

    socket.emit('join', { user_id: "{{ current_user.id }}" });

    socket.on('new_message', data => {
        const container = document.getElementById('notifications-container');

        const box = document.createElement('div');
        box.className = "rounded-lg bg-white hover:bg-gray-100 p-6 shadow-md outline outline-black/5 transition-colors duration-200 cursor-pointer";
        box.onclick = () => {
            window.location.href = `/messages`;
        };

        box.innerHTML = `
            <div class="space-y-1">
                <p>Nytt meddelande från <span class="font-bold">${data.sender}</span></p>
                <p class="truncate">${data.content}</p>
            </div>
        `;

        container.appendChild(box);

        // Remove after 5 seconds
        setTimeout(() => container.removeChild(box), 5000);
    });
</script>
