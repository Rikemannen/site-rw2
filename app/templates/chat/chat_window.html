<div class="container mx-auto p-4">
    <div class="bg-slate-200 rounded-md shadow-md p-4">
        <h1 class="text-2xl font-bold mb-4">Chatt</h1>
        <div id="chat-box" class="bg-white h-64 overflow-y-scroll p-2 mb-4 rounded-md border border-gray-300">
            {% for message, user in messages %}
            <div>
                <a href="/user/{{ user.id }}" class="hover:underline">
                    {{ user.display_name ~ ' (@' ~ user.name ~ ')' if user.display_name and user.display_name !=
                    user.name else user.name }}</a>: {{ message }}
            </div>
            {% endfor %}
        </div>
        <form id="chat-form" class="flex">
            <input id="message-input" type="text" placeholder="Skriv ett meddelande..."
                class="flex-grow p-2 border border-gray-300 rounded-l-md">
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-r-md">Skicka</button>
        </form>
    </div>
</div>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();

    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const chatBox = document.getElementById('chat-box');

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (input.value.trim() !== '') {
            socket.emit('send_message', { message: input.value });
            input.value = '';
        }
    });

    socket.on('receive_message', function (data) {
        const msg = document.createElement('div');
        const displayName = data.display_name;
        const username = data.username;
        const id = data.id;
        const message = data.message;

        const nameText = (displayName && displayName !== username)
            ? `${displayName} (@${username})`
            : username;

        msg.innerHTML = `<a href="/user/${id}" class="hover:underline">${nameText}</a>: ${message}`;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    });
</script>
