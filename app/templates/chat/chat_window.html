<div class="bg-slate-100 rounded-md shadow-md p-4">
    <h1 class="text-2xl font-bold mb-4"><a href="/chat" class="hover:underline">Chatt</a></h1>
    <div id="chat-box" class="bg-white h-64 overflow-y-scroll p-2 mb-4 rounded-md border border-gray-300">
    </div>
    <form id="chat-form" class="flex">
        <input id="message-input" type="text" placeholder="Skriv ett meddelande..."
            class="flex-grow p-2 border border-gray-400 rounded-l-md">
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-r-md">Skicka</button>
    </form>
</div>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const chatBox = document.getElementById('chat-box');

    function formatTime(unixTime) {
        const date = new Date(unixTime * 1000);
        return date.toLocaleTimeString(undefined, { hour12: false });
    }

    function renderMessage(data) {
        const msg = document.createElement('div');
        const nameText = (data.display_name && data.display_name !== data.name)
            ? `${data.display_name} (@${data.name})`
            : data.name;

        msg.innerHTML = `<div class="flex flex-wrap gap-4 mb-1 mt-1 p-1 rounded-sm shadow-sm items-center justify-between" style="color: ${data.color}; background-color: ${data.color}33;"><p><a href="/user/${data.id}" class="hover:underline">${nameText}</a>: ${data.message}</p><p class="text-gray-600 text-sm" style="color: ${data.color};">${formatTime(data.time)}</p></div>`;
        chatBox.appendChild(msg);
    }

    // Load existing messages
    window.onload = async function () {
        const res = await fetch('/chat/messages');
        const messages = await res.json();
        messages.forEach(renderMessage);
        chatBox.scrollTop = chatBox.scrollHeight;
    };

    const socket = io();
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (input.value.trim() !== '') {
            socket.emit('send_message', { message: input.value });
            input.value = '';
        }
    });

    socket.on('receive_message', function (data) {
        renderMessage(data);
        chatBox.scrollTop = chatBox.scrollHeight;
    });
</script>
